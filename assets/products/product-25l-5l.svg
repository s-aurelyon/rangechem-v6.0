<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 25L Drum Body Gradient (Translucent White Industrial Polyethylene) -->
    <linearGradient id="drumGrad25L" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eaedf0" />
      <stop offset="20%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#dce1e6" />
      <stop offset="100%" stop-color="#9ca3af" />
    </linearGradient>

    <!-- 5L Bottle Body Gradient -->
    <linearGradient id="bodyGrad5L_duo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f9fafb" />
      <stop offset="85%" stop-color="#d1d5db" />
      <stop offset="100%" stop-color="#9ca3af" />
    </linearGradient>

    <!-- 25L Green Cap Gradient (matching Degrasol 25L green cap) -->
    <linearGradient id="greenCapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="30%" stop-color="#22c55e" />
      <stop offset="75%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- 5L White Cap Gradient -->
    <linearGradient id="whiteCapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f3f4f6" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#d1d5db" />
      <stop offset="100%" stop-color="#9ca3af" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow-drum" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="-4" dy="16" stdDeviation="22" flood-color="#141414" flood-opacity="0.22" />
    </filter>

    <filter id="shadow-5l" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-6" dy="12" stdDeviation="16" flood-color="#141414" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════
       BASE SHADOWS
  ═══════════════════════════════════════════════════════════ -->
  <!-- 25L Drum Base Shadow -->
  <ellipse cx="230" cy="468" rx="160" ry="24" fill="#141414" opacity="0.2" filter="url(#shadow-drum)" />
  <!-- 5L Front Container Base Shadow -->
  <ellipse cx="365" cy="472" rx="95" ry="18" fill="#141414" opacity="0.3" filter="url(#shadow-5l)" />

  <!-- ═══════════════════════════════════════════════════════════
       25L DRUM (BACKGROUND CONTAINER)
  ═══════════════════════════════════════════════════════════ -->
  <g filter="url(#shadow-drum)">
    <!-- Main 25L Drum Silhouette (Tall, Rounded Heavy Duty Drum) -->
    <path d="M105,95 
             C105,62 135,42 175,42 
             L285,42 
             C325,42 355,62 355,95 
             L355,425 
             C355,455 325,466 285,466 
             L175,466 
             C135,466 105,455 105,425 
             Z" 
          fill="url(#drumGrad25L)" stroke="#cbd5e1" stroke-width="2" />
  </g>

  <!-- 25L Molded Top Recesses and Handles -->
  <path d="M125,58 C140,50 160,48 175,48 L285,48 C300,48 320,50 335,58 L335,76 C320,68 300,66 285,66 L175,66 C160,66 140,68 125,76 Z" fill="#94a3b8" opacity="0.3" />
  <rect x="135" y="46" width="30" height="12" rx="5" fill="#cbd5e1" />
  <rect x="295" y="46" width="30" height="12" rx="5" fill="#cbd5e1" />

  <!-- 25L Center Green Cap with Breather / Spout -->
  <g>
    <!-- Cap Neck -->
    <rect x="205" y="32" width="50" height="12" rx="2" fill="#cbd5e1" />
    <!-- Green Cap -->
    <path d="M200,18 L260,18 C264,18 267,21 267,26 L267,36 L193,36 L193,26 C193,21 196,18 200,18 Z" fill="url(#greenCapGrad)" filter="url(#shadow-drum)" />
    <!-- Cap Grooves -->
    <rect x="198" y="21" width="4" height="15" fill="#ffffff" opacity="0.25" />
    <rect x="208" y="21" width="4" height="15" fill="#ffffff" opacity="0.25" />
    <rect x="218" y="21" width="4" height="15" fill="#ffffff" opacity="0.25" />
    <rect x="228" y="21" width="4" height="15" fill="#ffffff" opacity="0.25" />
    <rect x="238" y="21" width="4" height="15" fill="#ffffff" opacity="0.25" />
    <rect x="248" y="21" width="4" height="15" fill="#ffffff" opacity="0.25" />
    <rect x="258" y="21" width="4" height="15" fill="#ffffff" opacity="0.25" />
    <!-- White center tap spout -->
    <path d="M225,12 L235,12 L238,28 L222,28 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  </g>

  <!-- 25L Embossed Side Ribs -->
  <rect x="112" y="140" width="10" height="260" rx="5" fill="#cbd5e1" opacity="0.5" />
  <rect x="338" y="140" width="10" height="260" rx="5" fill="#94a3b8" opacity="0.5" />

  <!-- 25L Main Label (Degrasol Layout) -->
  <g>
    <!-- Label Background -->
    <rect x="135" y="130" width="190" height="235" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-drum)" />
    
    <!-- Rangechem Emblem Circle -->
    <g transform="translate(162, 162)">
      <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#d63121" stroke-width="2" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#141414" stroke-width="0.8" stroke-dasharray="2 1" />
      <text x="0" y="-7" font-family="Montserrat, sans-serif" font-weight="900" font-size="5" fill="#d63121" text-anchor="middle">RANGE</text>
      <!-- Flask icon -->
      <path d="M-3,-2 L3,-2 L4,4 C4,6 2,8 0,8 C-2,8 -4,6 -4,4 Z" fill="#141414" />
      <text x="0" y="13" font-family="Montserrat, sans-serif" font-weight="900" font-size="5" fill="#141414" text-anchor="middle">CHEM</text>
    </g>

    <!-- Title: DEGRASOL -->
    <text x="245" y="162" font-family="Montserrat, sans-serif" font-weight="900" font-size="17" fill="#141414" text-anchor="middle" letter-spacing="1">DEGRASOL</text>
    <text x="245" y="176" font-family="Montserrat, sans-serif" font-weight="800" font-size="6.5" fill="#d63121" text-anchor="middle">SOLVENT BASED HEAVY DUTY</text>
    <text x="245" y="184" font-family="Montserrat, sans-serif" font-weight="800" font-size="6.5" fill="#d63121" text-anchor="middle">OIL AND GREASE CLEANER</text>

    <!-- Divider Line -->
    <line x1="145" y1="194" x2="315" y2="194" stroke="#e2e8f0" stroke-width="1" />

    <!-- Label Copy Simulation -->
    <rect x="145" y="202" width="165" height="4" rx="2" fill="#64748b" opacity="0.8" />
    <rect x="145" y="210" width="170" height="3" rx="1.5" fill="#cbd5e1" />
    <rect x="145" y="216" width="155" height="3" rx="1.5" fill="#cbd5e1" />
    <rect x="145" y="222" width="160" height="3" rx="1.5" fill="#cbd5e1" />
    <rect x="145" y="230" width="100" height="4" rx="2" fill="#64748b" opacity="0.8" />
    <rect x="145" y="238" width="165" height="3" rx="1.5" fill="#cbd5e1" />
    <rect x="145" y="244" width="140" height="3" rx="1.5" fill="#cbd5e1" />

    <!-- 25L Size Badge on Label -->
    <rect x="290" y="332" width="28" height="18" rx="2" fill="#ffffff" stroke="#141414" stroke-width="1.5" />
    <text x="304" y="345" font-family="Montserrat, sans-serif" font-weight="900" font-size="9" fill="#141414" text-anchor="middle">25L</text>
  </g>

  <!-- 25L Specular Highlight Strip -->
  <path d="M120,95 C120,70 140,58 165,58 L185,58 C160,120 135,320 135,435 C120,430 120,200 120,95 Z" fill="#ffffff" opacity="0.6" />


  <!-- ═══════════════════════════════════════════════════════════
       5L JERRY CAN (FOREGROUND RIGHT CONTAINER)
  ═══════════════════════════════════════════════════════════ -->
  <g filter="url(#shadow-5l)">
    <!-- 5L Outer Body with Handle Contour -->
    <path d="M260,285
             C260,255 275,242 295,242
             L330,242
             C338,242 344,235 348,220
             L355,188
             C358,178 368,172 378,172
             L440,172
             C456,172 465,182 465,198
             L465,445
             C465,462 455,470 435,470
             L290,470
             C270,470 260,462 260,445
             Z" 
          fill="url(#bodyGrad5L_duo)" stroke="#94a3b8" stroke-width="1.8" />
  </g>

  <!-- 5L Handle Cutout (Negative Space) -->
  <path d="M375,240
           C375,228 385,220 398,220
           L425,220
           C438,220 445,228 445,240
           L445,280
           C445,292 438,300 425,300
           L398,300
           C385,300 375,292 375,280
           Z" 
        fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow-5l)" />

  <!-- 5L White Screw Cap on Left Top Shoulder -->
  <g>
    <!-- Cap Neck -->
    <rect x="278" y="222" width="36" height="8" rx="2" fill="#cbd5e1" />
    <!-- White Cap -->
    <path d="M275,200 L318,200 C321,200 324,203 324,207 L324,224 L269,224 L269,207 C269,203 272,200 275,200 Z" fill="url(#whiteCapGrad)" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow-5l)" />
    <!-- Cap Ribs -->
    <rect x="274" y="204" width="3" height="17" fill="#64748b" opacity="0.2" />
    <rect x="282" y="204" width="3" height="17" fill="#64748b" opacity="0.2" />
    <rect x="290" y="204" width="3" height="17" fill="#64748b" opacity="0.2" />
    <rect x="298" y="204" width="3" height="17" fill="#64748b" opacity="0.2" />
    <rect x="306" y="204" width="3" height="17" fill="#64748b" opacity="0.2" />
    <rect x="314" y="204" width="3" height="17" fill="#64748b" opacity="0.2" />
  </g>

  <!-- 5L Front Label -->
  <g>
    <!-- Label Background -->
    <rect x="285" y="325" width="155" height="135" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#shadow-5l)" />
    
    <!-- Mini Rangechem Emblem Circle -->
    <g transform="translate(306, 348)">
      <circle cx="0" cy="0" r="13" fill="#ffffff" stroke="#d63121" stroke-width="1.5" />
      <text x="0" y="-5" font-family="Montserrat, sans-serif" font-weight="900" font-size="3.8" fill="#d63121" text-anchor="middle">RANGE</text>
      <path d="M-2,-1 L2,-1 L3,3 C3,4.5 1.5,5.5 0,5.5 C-1.5,5.5 -3,4.5 -3,3 Z" fill="#141414" />
      <text x="0" y="10" font-family="Montserrat, sans-serif" font-weight="900" font-size="3.8" fill="#141414" text-anchor="middle">CHEM</text>
    </g>

    <!-- Title: DEGRASOL -->
    <text x="372" y="348" font-family="Montserrat, sans-serif" font-weight="900" font-size="13" fill="#141414" text-anchor="middle" letter-spacing="0.5">DEGRASOL</text>
    <text x="372" y="358" font-family="Montserrat, sans-serif" font-weight="800" font-size="5" fill="#d63121" text-anchor="middle">SOLVENT BASED HEAVY DUTY</text>
    <text x="372" y="364" font-family="Montserrat, sans-serif" font-weight="800" font-size="5" fill="#d63121" text-anchor="middle">OIL AND GREASE CLEANER</text>

    <!-- Details -->
    <rect x="295" y="375" width="135" height="3" rx="1.5" fill="#64748b" opacity="0.8" />
    <rect x="295" y="381" width="130" height="2.5" rx="1" fill="#cbd5e1" />
    <rect x="295" y="386" width="120" height="2.5" rx="1" fill="#cbd5e1" />
    <rect x="295" y="393" width="90" height="3" rx="1.5" fill="#64748b" opacity="0.8" />
    <rect x="295" y="399" width="125" height="2.5" rx="1" fill="#cbd5e1" />

    <!-- 5L Size Badge -->
    <rect x="408" y="432" width="24" height="15" rx="2" fill="#ffffff" stroke="#141414" stroke-width="1.2" />
    <text x="420" y="443" font-family="Montserrat, sans-serif" font-weight="900" font-size="8" fill="#141414" text-anchor="middle">5L</text>
  </g>

  <!-- 5L Plastic Reflection Highlight -->
  <path d="M268,285 C268,260 278,250 292,250 L320,250 C305,290 288,380 288,445 C268,440 268,320 268,285 Z" fill="#ffffff" opacity="0.5" />
</svg>
