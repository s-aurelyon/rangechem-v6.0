<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1280" width="100%" height="100%" fill="none">
  <defs>
    <!-- Crisp floating label shadow -->
    <filter id="labelDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <!-- 25L Container Body Gradient -->
    <linearGradient id="drum25LBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BAC7D5"/>
      <stop offset="5%" stop-color="#DCE4EC"/>
      <stop offset="14%" stop-color="#F4F7FA"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FFFFFF"/>
      <stop offset="86%" stop-color="#E5ECF3"/>
      <stop offset="96%" stop-color="#C9D6E2"/>
      <stop offset="100%" stop-color="#AEBDCC"/>
    </linearGradient>

    <!-- 25L Specular Vertical Highlight Streak -->
    <linearGradient id="specularStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="28%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="34%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 25L Bottom Skirt Gradient -->
    <linearGradient id="drumBottomSkirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Green Cap Gradients -->
    <linearGradient id="greenCapCylinder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="20%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="80%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <linearGradient id="greenCapTopDome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- 5L Jug Gradients -->
    <linearGradient id="jug5LBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8C7D6"/>
      <stop offset="8%" stop-color="#DFE7EE"/>
      <stop offset="22%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FFFFFF"/>
      <stop offset="88%" stop-color="#E2EAF1"/>
      <stop offset="98%" stop-color="#BAC8D6"/>
      <stop offset="100%" stop-color="#A5B5C5"/>
    </linearGradient>

    <linearGradient id="whiteCapNeck" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="25%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="90%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Brand Color Accents -->
    <linearGradient id="brandRedAccents" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B"/>
      <stop offset="100%" stop-color="#D91438"/>
    </linearGradient>

    <linearGradient id="brandRedSoft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>
  </defs>

  <!-- ================================================================ -->
  <!-- ================= 25L INDUSTRIAL CANISTER ====================== -->
  <!-- ================================================================ -->
  <g id="canister-25L">
    
    <!-- 1. 25L TOP GREEN CAP (Clean Screw Cap - No Vertical Tab/Straw) -->
    <g id="drum-25L-cap-group">
      <!-- Cap Base Neck -->
      <path d="M400 82 C400 72 414 66 455 66 C496 66 510 72 510 82 V92 C510 98 496 102 455 102 C414 102 400 98 400 92 Z" fill="#032E24"/>
      
      <!-- Emerald Green Cap Cylinder -->
      <path d="M402 54 C402 46 416 40 455 40 C494 40 508 46 508 54 V78 C508 86 494 92 455 92 C416 92 402 86 402 78 Z" fill="url(#greenCapCylinder)"/>
      
      <!-- Smooth Green Cap Top Dome -->
      <ellipse cx="455" cy="54" rx="53" ry="14" fill="url(#greenCapTopDome)" stroke="#6EE7B7" stroke-width="1.2"/>

      <!-- Vertical Grip Serrations -->
      <g stroke="#032E24" stroke-width="2.5" stroke-linecap="round" opacity="0.75">
        <line x1="410" y1="57" x2="410" y2="76"/>
        <line x1="422" y1="62" x2="422" y2="81"/>
        <line x1="436" y1="65" x2="436" y2="86"/>
        <line x1="450" y1="67" x2="450" y2="88"/>
        <line x1="460" y1="67" x2="460" y2="88"/>
        <line x1="474" y1="65" x2="474" y2="86"/>
        <line x1="488" y1="62" x2="488" y2="81"/>
        <line x1="500" y1="57" x2="500" y2="76"/>
      </g>
    </g>

    <!-- 2. 25L MAIN CANISTER BODY (Solid, Seamless Top Crown - No Holes) -->
    <path d="M 230,80
             C 240,78  260,78  300,78
             L 370,78
             C 385,78  395,84  400,98
             C 405,114 415,124 455,124
             C 495,124 505,114 510,98
             C 515,84  525,78  540,78
             L 610,78
             C 650,78  670,78  680,80
             C 745,95  775,130 775,200
             L 775,450
             C 775,700 780,950 755,1095
             C 745,1145 700,1175 600,1180
             L 310,1180
             C 210,1175 165,1145 155,1095
             C 130,950 135,700 135,450
             L 135,200
             C 135,130 165,95  230,80 Z"
          fill="url(#drum25LBody)"
          stroke="#94A3B8"
          stroke-width="3.5"
          stroke-linejoin="round"/>

    <!-- Seamless Top Rim Highlights -->
    <path d="M 165,102 C 220,82 320,78 385,78" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 525,78 C 590,78 690,82 745,102" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9"/>

    <!-- Specular Highlight Streak -->
    <path d="M 230,80
             C 240,78  260,78  300,78
             L 370,78
             C 385,78  395,84  400,98
             C 405,114 415,124 455,124
             C 495,124 505,114 510,98
             C 515,84  525,78  540,78
             L 610,78
             C 650,78  670,78  680,80
             C 745,95  775,130 775,200
             L 775,450
             C 775,700 780,950 755,1095
             C 745,1145 700,1175 600,1180
             L 310,1180
             C 210,1175 165,1145 155,1095
             C 130,950 135,700 135,450
             L 135,200
             C 135,130 165,95  230,80 Z"
          fill="url(#specularStreak)"/>

    <!-- Bottom Skirt Base -->
    <path d="M 155,1095
             C 165,1145 210,1175 310,1180
             L 600,1180
             C 700,1175 745,1145 755,1095
             L 760,1115
             C 748,1165 700,1192 600,1196
             L 310,1196
             C 210,1192 162,1165 150,1115 Z"
          fill="url(#drumBottomSkirt)"/>

    <!-- 3. HORIZONTAL STRUCTURAL SHOULDER CREASES -->
    <path d="M 155,190 C 220,165 330,152 455,152 C 580,152 690,165 755,190" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 148,200 C 215,175 330,162 455,162 C 580,162 695,175 762,200" stroke="#BAC8D6" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- ================================================================ -->
    <!-- ================= 25L PRODUCT LABEL ============================ -->
    <!-- ================================================================ -->
    <g id="label-25L-master" transform="translate(195, 290)" filter="url(#labelDepth)">
      <rect x="0" y="0" width="520" height="580" rx="12" fill="#FFFFFF" stroke="#BAC7D5" stroke-width="2.5"/>
      <rect x="12" y="12" width="496" height="556" rx="8" fill="none" stroke="#F1F5F9" stroke-width="1.8"/>

      <!-- Top Red Header Wire with Pill Brand Badge -->
      <path d="M14 34 H195 M325 34 H506" stroke="#D91438" stroke-width="2" stroke-linecap="round"/>
      <rect x="202" y="20" width="120" height="28" rx="14" fill="url(#brandRedSoft)" stroke="#D91438" stroke-width="1.8"/>
      <rect x="218" y="30" width="88" height="8" rx="4" fill="url(#brandRedAccents)"/>

      <!-- Circular Logo Emblem (Top Left) -->
      <g id="logo-emblem-25L" transform="translate(28, 52)">
        <circle cx="50" cy="50" r="46" fill="#FFFFFF" stroke="url(#brandRedAccents)" stroke-width="4"/>
        <circle cx="50" cy="50" r="38" fill="none" stroke="#FF334B" stroke-width="1.8" stroke-dasharray="4 2.5"/>
        
        <path d="M25 36 C34 25 66 25 75 36" stroke="#D91438" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M27 64 C36 73 64 73 73 64" stroke="#D91438" stroke-width="4" stroke-linecap="round" fill="none"/>

        <!-- Chemical Flask -->
        <path d="M45 34 H55 M50 34 V44 L60 62 C62 66 59 70 54 70 H46 C41 70 38 66 40 62 L50 44" 
              fill="url(#brandRedAccents)" stroke="#D91438" stroke-width="2.2" stroke-linejoin="round"/>
        <circle cx="50" cy="55" r="2.5" fill="#FFFFFF"/>
        <circle cx="55" cy="61" r="1.8" fill="#FFFFFF"/>

        <!-- Cross Accents -->
        <line x1="8" y1="50" x2="18" y2="50" stroke="#D91438" stroke-width="3" stroke-linecap="round"/>
        <line x1="82" y1="50" x2="92" y2="50" stroke="#D91438" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- Headline Typography Bars -->
      <g id="header-typography-25L" transform="translate(142, 60)">
        <rect x="0" y="0" width="350" height="28" rx="7" fill="#0F172A"/>
        <rect x="15" y="38" width="320" height="13" rx="6.5" fill="url(#brandRedAccents)"/>
        <rect x="60" y="56" width="230" height="11" rx="5.5" fill="url(#brandRedAccents)"/>
      </g>

      <!-- Description Block -->
      <g transform="translate(28, 178)">
        <rect x="0" y="0" width="464" height="8" rx="4" fill="#334155"/>
        <rect x="0" y="15" width="445" height="8" rx="4" fill="#334155"/>
        <rect x="0" y="30" width="395" height="8" rx="4" fill="#334155"/>
      </g>

      <!-- Section 1: DIRECTIONS FOR USE -->
      <g transform="translate(28, 238)">
        <rect x="0" y="0" width="145" height="10" rx="5" fill="#0F172A"/>
        <rect x="0" y="18" width="275" height="7" rx="3.5" fill="#64748B"/>
        <rect x="0" y="30" width="260" height="7" rx="3.5" fill="#64748B"/>
        <rect x="0" y="42" width="450" height="7" rx="3.5" fill="#64748B"/>
      </g>

      <!-- Section 2: CAUTION -->
      <g transform="translate(28, 314)">
        <rect x="0" y="0" width="75" height="10" rx="5" fill="#0F172A"/>
        <rect x="0" y="17" width="455" height="7" rx="3.5" fill="#64748B"/>
        <rect x="0" y="29" width="130" height="7" rx="3.5" fill="#64748B"/>
      </g>

      <!-- Section 3: STORAGE -->
      <g transform="translate(28, 376)">
        <rect x="0" y="0" width="80" height="10" rx="5" fill="#0F172A"/>
        <rect x="0" y="17" width="320" height="7" rx="3.5" fill="#64748B"/>
      </g>

      <!-- Disclaimer Lines -->
      <g transform="translate(28, 446)" opacity="0.6">
        <line x1="0" y1="0" x2="464" y2="0" stroke="#CBD5E1" stroke-width="1.8" stroke-linecap="round"/>
        <rect x="30" y="13" width="404" height="5" rx="2.5" fill="#64748B"/>
        <rect x="80" y="23" width="304" height="5" rx="2.5" fill="#64748B"/>
      </g>

      <!-- Bottom Address Bar -->
      <g transform="translate(28, 502)">
        <rect x="0" y="0" width="464" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.8"/>
        <rect x="20" y="14" width="424" height="10" rx="5" fill="#64748B"/>
      </g>
    </g>
  </g>

  <!-- ================================================================ -->
  <!-- ================= 5L ERGONOMIC JUG ============================= -->
  <!-- ================================================================ -->
  <g id="canister-5L">
    
    <!-- 1. 5L Left Spout Neck & Ribbed Screw Cap -->
    <g id="cap-5L-master" transform="translate(425, 580)">
      <path d="M 5,46 C 5,38 18,32 50,32 C 82,32 95,38 95,46 V 55 H 5 Z" fill="#BAC7D5"/>
      <rect x="2" y="2" width="96" height="46" rx="7" fill="url(#whiteCapNeck)" stroke="#94A3B8" stroke-width="1.8"/>
      <ellipse cx="50" cy="4" rx="48" ry="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

      <!-- Vertical Ribbing -->
      <g stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.65">
        <line x1="16" y1="5" x2="16" y2="45"/>
        <line x1="30" y1="5" x2="30" y2="45"/>
        <line x1="44" y1="5" x2="44" y2="45"/>
        <line x1="56" y1="5" x2="56" y2="45"/>
        <line x1="70" y1="5" x2="70" y2="45"/>
        <line x1="84" y1="5" x2="84" y2="45"/>
      </g>
    </g>

    <!-- 2. 5L Main Body & Sculpted Handle Outer Perimeter -->
    <path d="M 430,642
             H 522
             L 540,668
             C 558,634 595,590 670,590
             H 795
             C 865,590 910,635 924,700
             C 935,750 930,815 930,870
             L 925,1140
             C 920,1200 880,1238 805,1240
             H 520
             C 445,1240 405,1200 400,1140
             L 395,870
             C 395,770 412,685 430,642 Z"
          fill="url(#jug5LBodyGrad)"
          stroke="#94A3B8"
          stroke-width="3.5"
          stroke-linejoin="round"/>

    <!-- 3. 5L Ergonomic Handle Cutout with 3 Tactile Finger Grooves -->
    <g id="handle-cutout-5L-master">
      <path d="M 625,675
               C 625,650 655,640 700,640
               H 792
               C 835,640 858,655 858,680
               C 858,708 840,720 822,725
               C 800,732 785,725 765,734
               C 742,742 730,728 708,734
               C 685,742 670,728 648,725
               C 630,720 625,704 625,675 Z"
            fill="#E5EDF4"
            stroke="#7E8F9D"
            stroke-width="3"
            stroke-linejoin="round"/>

      <path d="M 625,675 C 625,650 655,640 700,640 H 792 C 835,640 858,655 858,680" 
            stroke="#475569" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.45"/>
      <path d="M 858,680 C 858,708 840,720 822,725 C 800,732 785,725 765,734 C 742,742 730,728 708,734 C 685,742 670,728 648,725 C 630,720 625,704 625,675" 
            stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.95"/>
    </g>

    <!-- 5L Shoulder Bevel Line & Highlights -->
    <path d="M 410,825 C 430,790 530,778 670,778 C 810,778 900,790 915,825" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85" fill="none"/>
    <path d="M 405,836 C 425,802 530,790 670,790 C 810,790 905,802 920,836" stroke="#BAC7D5" stroke-width="2.5" stroke-linecap="round" opacity="0.6" fill="none"/>

    <!-- ================================================================ -->
    <!-- ================= 5L PRODUCT FRONT LABEL ======================= -->
    <!-- ================================================================ -->
    <g id="label-5L-master" transform="translate(445, 835)" filter="url(#labelDepth)">
      <rect x="0" y="0" width="435" height="375" rx="10" fill="#FFFFFF" stroke="#BAC7D5" stroke-width="2"/>
      <rect x="9" y="9" width="417" height="357" rx="6" fill="none" stroke="#F1F5F9" stroke-width="1.5"/>

      <!-- Top Red Wire with Pill Capsule -->
      <path d="M12 24 H155 M280 24 H423" stroke="#D91438" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="160" y="13" width="115" height="22" rx="11" fill="url(#brandRedSoft)" stroke="#D91438" stroke-width="1.4"/>
      <rect x="175" y="20" width="85" height="8" rx="4" fill="url(#brandRedAccents)"/>

      <!-- Circular Logo Emblem (5L) -->
      <g id="logo-emblem-5L" transform="translate(20, 38)">
        <circle cx="36" cy="36" r="32" fill="#FFFFFF" stroke="url(#brandRedAccents)" stroke-width="3"/>
        <circle cx="36" cy="36" r="26" fill="none" stroke="#FF334B" stroke-width="1.4" stroke-dasharray="3 1.8"/>
        
        <path d="M17 26 C24 18 48 18 55 26" stroke="#D91438" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M19 46 C26 53 46 53 53 46" stroke="#D91438" stroke-width="3" stroke-linecap="round" fill="none"/>

        <!-- Flask -->
        <path d="M33 24 H39 M36 24 V31 L44 44 C45 47 43 49 39 49 H33 C29 49 27 47 28 44 L36 31" 
              fill="url(#brandRedAccents)" stroke="#D91438" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="36" cy="40" r="1.8" fill="#FFFFFF"/>
        <circle cx="39" cy="44" r="1.2" fill="#FFFFFF"/>
      </g>

      <!-- Headline (5L) -->
      <g id="header-typography-5L" transform="translate(100, 44)">
        <rect x="0" y="0" width="310" height="20" rx="5.5" fill="#0F172A"/>
        <rect x="12" y="27" width="285" height="10" rx="5" fill="url(#brandRedAccents)"/>
        <rect x="50" y="41" width="210" height="9" rx="4.5" fill="url(#brandRedAccents)"/>
      </g>

      <!-- Description Block -->
      <g transform="translate(20, 122)">
        <rect x="0" y="0" width="395" height="6" rx="3" fill="#334155"/>
        <rect x="0" y="11" width="380" height="6" rx="3" fill="#334155"/>
        <rect x="0" y="22" width="335" height="6" rx="3" fill="#334155"/>
      </g>

      <!-- Section 1: DIRECTIONS -->
      <g transform="translate(20, 166)">
        <rect x="0" y="0" width="120" height="8" rx="4" fill="#0F172A"/>
        <rect x="0" y="13" width="235" height="5.5" rx="2.75" fill="#64748B"/>
        <rect x="0" y="22" width="220" height="5.5" rx="2.75" fill="#64748B"/>
        <rect x="0" y="31" width="385" height="5.5" rx="2.75" fill="#64748B"/>
      </g>

      <!-- Section 2: CAUTION -->
      <g transform="translate(20, 222)">
        <rect x="0" y="0" width="60" height="8" rx="4" fill="#0F172A"/>
        <rect x="0" y="12" width="390" height="5.5" rx="2.75" fill="#64748B"/>
      </g>

      <!-- Section 3: STORAGE -->
      <g transform="translate(20, 260)">
        <rect x="0" y="0" width="65" height="8" rx="4" fill="#0F172A"/>
        <rect x="0" y="12" width="265" height="5.5" rx="2.75" fill="#64748B"/>
      </g>

      <!-- Disclaimer -->
      <g transform="translate(20, 298)" opacity="0.65">
        <line x1="0" y1="0" x2="395" y2="0" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="round"/>
        <rect x="18" y="9" width="360" height="4.5" rx="2.25" fill="#64748B"/>
        <rect x="55" y="17" width="285" height="4.5" rx="2.25" fill="#64748B"/>
      </g>

      <!-- Bottom Tag with 5L Badge -->
      <g transform="translate(20, 332)">
        <rect x="0" y="0" width="325" height="30" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/>
        <rect x="12" y="11" width="300" height="8" rx="4" fill="#64748B"/>

        <!-- "5L" Badge Box Tag -->
        <g transform="translate(335, -2)">
          <rect x="0" y="0" width="60" height="32" rx="7" fill="#0F172A"/>
          <text x="30" y="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">5L</text>
        </g>
      </g>
    </g>
  </g>
</svg>
