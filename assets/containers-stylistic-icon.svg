<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <!-- Stylistic Modern Icon Gradients -->
    <linearGradient id="stylisticDrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="stylisticJug" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#D5DFE9"/>
    </linearGradient>

    <linearGradient id="stylisticCapEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="stylisticBrandRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <filter id="iconSoftShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <filter id="jugFrontShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="#090E17" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="115" cy="242" rx="96" ry="8" fill="#0F172A" fill-opacity="0.08"/>
  <ellipse cx="180" cy="242" rx="46" ry="6" fill="#0F172A" fill-opacity="0.14"/>

  <!-- ================= 25L INDUSTRIAL CONTAINER (BACKGROUND) ================= -->
  <g filter="url(#iconSoftShadow)">
    <!-- Emerald Green Threaded Cap -->
    <path d="M96 20 C96 16.5 98.5 14 102 14 H128 C131.5 14 134 16.5 134 20 V26 H96 V20 Z" fill="url(#stylisticCapEmerald)" stroke="#047857" stroke-width="1.8" stroke-linejoin="round"/>
    <rect x="111" y="9" width="8" height="6" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- 25L Drum Body -->
    <path d="M52 44
             C52 33 60 29 76 25
             C82 23.5 94 24 96 25
             H134
             C136 24 148 23.5 154 25
             C170 29 178 33 178 44
             C181 80 183 140 178 205
             C176 226 164 236 142 238
             H88
             C66 236 54 226 52 205
             C47 140 49 80 52 44 Z"
          fill="url(#stylisticDrum)" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Sculpted Top Indentations -->
    <path d="M68 34 C74 32 84 33 88 39 C90 42 90 47 88 49 C85 51 75 50 68 46 Z" fill="#94A3B8" fill-opacity="0.25"/>
    <path d="M162 34 C156 32 146 33 142 39 C140 42 140 47 142 49 C145 51 155 50 162 46 Z" fill="#94A3B8" fill-opacity="0.25"/>

    <!-- 25L Front Label Card -->
    <g transform="translate(68, 62)">
      <rect x="0" y="0" width="94" height="110" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
      
      <!-- Top Red Line & Badge Wire -->
      <path d="M4 8 H30 M64 8 H90" stroke="#E11D48" stroke-width="1" stroke-linecap="round"/>
      <rect x="34" y="5" width="26" height="6" rx="3" fill="#FFF1F2" stroke="#E11D48" stroke-width="0.8"/>
      <rect x="38" y="7" width="18" height="2" rx="1" fill="url(#stylisticBrandRed)"/>

      <!-- Circular Logo Emblem -->
      <circle cx="16" cy="22" r="8" fill="#FFFFFF" stroke="url(#stylisticBrandRed)" stroke-width="1.2"/>
      <circle cx="16" cy="22" r="6.2" fill="none" stroke="#F43F5E" stroke-width="0.6" stroke-dasharray="1.2 0.8"/>
      <!-- Flask -->
      <path d="M14.5 18 H17.5 M16 18 V20.5 L18.5 24.5 C19 25.5 18 26.5 16.8 26.5 H15.2 C14 26.5 13 25.5 13.5 24.5 L16 20.5" 
            fill="url(#stylisticBrandRed)" stroke="#E11D48" stroke-width="0.6" stroke-linejoin="round"/>

      <!-- Main Headline Bars -->
      <rect x="29" y="16" width="57" height="4.5" rx="2.25" fill="#0F172A"/>
      <rect x="29" y="23" width="48" height="3" rx="1.5" fill="url(#stylisticBrandRed)"/>

      <!-- Streamlined Paragraph Line Blocks -->
      <rect x="8" y="34" width="78" height="2" rx="1" fill="#475569"/>
      <rect x="8" y="38" width="72" height="2" rx="1" fill="#475569"/>
      <rect x="8" y="42" width="56" height="2" rx="1" fill="#475569"/>

      <rect x="8" y="49" width="30" height="2.5" rx="1.25" fill="#0F172A"/>
      <rect x="8" y="54" width="76" height="1.8" rx="0.9" fill="#94A3B8"/>
      <rect x="8" y="58" width="70" height="1.8" rx="0.9" fill="#94A3B8"/>
      <rect x="8" y="62" width="74" height="1.8" rx="0.9" fill="#94A3B8"/>

      <rect x="8" y="69" width="22" height="2.5" rx="1.25" fill="#0F172A"/>
      <rect x="8" y="74" width="76" height="1.8" rx="0.9" fill="#94A3B8"/>

      <rect x="8" y="81" width="24" height="2.5" rx="1.25" fill="#0F172A"/>
      <rect x="8" y="86" width="65" height="1.8" rx="0.9" fill="#94A3B8"/>

      <!-- Bottom Address Bar -->
      <rect x="6" y="96" width="82" height="8" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
      <rect x="12" y="99.5" width="70" height="1.5" rx="0.75" fill="#94A3B8"/>
    </g>
  </g>

  <!-- ================= 5L CONTAINER (FOREGROUND) ================= -->
  <g filter="url(#jugFrontShadow)">
    <!-- 5L Left Cap -->
    <path d="M127 122 C127 120 129 118 131 118 H147 C149 118 151 120 151 122 V132 H127 V122 Z" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="133" y1="120" x2="133" y2="130" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="139" y1="120" x2="139" y2="130" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="145" y1="120" x2="145" y2="130" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- 5L Body & Handle Outer Path -->
    <path d="M129 132
             H149
             L152 142
             C158 136 166 128 178 128
             H194
             C206 128 214 136 218 146
             C221 154 220 168 220 178
             L219 230
             C218 240 210 246 198 246
             H143
             C131 246 123 240 122 230
             L121 168
             C121 152 125 142 129 132 Z"
          fill="url(#stylisticJug)" stroke="#475569" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- 5L Handle Cutout (Ergonomic 3-ridge curve) -->
    <path d="M165 142
             C165 138 170 137 178 137
             H194
             C202 137 207 140 207 145
             C207 150 203 153 200 155
             C196 156 193 155 189 157
             C185 158 183 156 179 157
             C175 158 172 156 168 155
             C165 153 165 148 165 142 Z"
          fill="#D8E2EC" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>

    <!-- 5L Front Label Card -->
    <g transform="translate(131, 168)">
      <rect x="0" y="0" width="77" height="66" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>

      <!-- Logo -->
      <circle cx="11" cy="11" r="6" fill="#FFFFFF" stroke="url(#stylisticBrandRed)" stroke-width="1"/>
      <path d="M10 8.5 H12 M11 8.5 V10.2 L12.8 13 C13.2 13.6 12.5 14.3 11.6 14.3 H10.4 C9.5 14.3 8.8 13.6 9.2 13 L11 10.2" 
            fill="url(#stylisticBrandRed)" stroke="#E11D48" stroke-width="0.5" stroke-linejoin="round"/>

      <!-- Title Bars -->
      <rect x="21" y="7" width="50" height="3.5" rx="1.75" fill="#0F172A"/>
      <rect x="21" y="12" width="44" height="2.5" rx="1.25" fill="url(#stylisticBrandRed)"/>

      <!-- Line Blocks -->
      <rect x="5" y="18" width="67" height="1.6" rx="0.8" fill="#475569"/>
      <rect x="5" y="21.5" width="62" height="1.6" rx="0.8" fill="#475569"/>
      <rect x="5" y="25" width="50" height="1.6" rx="0.8" fill="#475569"/>

      <rect x="5" y="30" width="22" height="2" rx="1" fill="#0F172A"/>
      <rect x="5" y="34" width="66" height="1.4" rx="0.7" fill="#94A3B8"/>
      <rect x="5" y="37.5" width="60" height="1.4" rx="0.7" fill="#94A3B8"/>

      <rect x="5" y="43" width="18" height="2" rx="1" fill="#0F172A"/>
      <rect x="5" y="47" width="52" height="1.4" rx="0.7" fill="#94A3B8"/>

      <!-- Stylistic "5L" Badge (Dark slate pill badge) -->
      <rect x="58" y="51" width="15" height="11" rx="2.5" fill="#0F172A"/>
      <text x="65.5" y="59" font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">5L</text>
    </g>
  </g>
</svg>
