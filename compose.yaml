services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: rangechem
      MARIADB_USER: rangechem
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - rangechem_db:/var/lib/mysql
volumes:
  rangechem_db:
